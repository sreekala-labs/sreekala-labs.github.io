<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 160 }}">
  <link rel="icon" href="data:,">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="page">
    <header class="site-header">
      <a class="site-header__mark" href="{{ '/' | relative_url }}">
        <span class="dot" aria-hidden="true"></span>
        <span class="site-header__name">Sreenath Kalahasti</span>
      </a>
      <nav class="site-header__nav">
        <a href="{{ '/' | relative_url }}">Log</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a href="https://github.com/sreekala-labs" target="_blank" rel="noopener">GitHub</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      </nav>
    </header>

    <main class="page__main">
      {{ content }}
    </main>

    <footer class="site-footer">
      <span>Built entry by entry, {{ site.time | date: '%Y' }}.</span>
      <a href="{{ '/feed.xml' | relative_url }}">Subscribe via RSS</a>
    </footer>
  </div>
</body>
</html>
